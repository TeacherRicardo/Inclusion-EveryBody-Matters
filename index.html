<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclusive Quest - 2nd Grade English</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #50E3C2;
      --accent: #FF6B6B;
      --bg: #F4F7F6;
      --text: #2C3E50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 750px;
      padding: 30px;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }
    p.subtitle { margin: 5px 0 0 0; color: #7f8c8d; font-size: 0.95rem; }

    .image-container {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      background-color: #e0e0e0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .question-box {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    button.option-btn {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    button.option-btn:hover {
      border-color: var(--primary);
      background-color: #eef5fc;
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    .feedback.correct { background: #d4edda; color: #155724; }
    .feedback.incorrect { background: #f8d7da; color: #721c24; }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .score-badge {
      background: var(--primary);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
    }

    .next-btn {
      background: var(--secondary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<div class="app-card">
  <header>
    <h1>🤝 Inclusion & Respect Quest</h1>
    <p class="subtitle">Practice 1st Conditional, Verbs & Anti-Bullying Vocabulary</p>
  </header>

  <div id="quiz-container">
    <div class="image-container">
      <img id="card-image" src="" alt="Inclusion Scene">
    </div>

    <div class="question-box" id="question-text">Loading question...</div>

    <div class="options-grid" id="options-container"></div>

    <div id="feedback" class="feedback"></div>

    <div class="footer-bar">
      <div class="score-badge">Points: <span id="score">0</span></div>
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>
  </div>
</div>

<script>
  // Banco de preguntas centrado en Inclusión, 1st Conditional y Vocabulario Clave
  const questions = [
    {
      image: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=700&q=80",
      question: "Complete with the 1st Conditional: If a new classmate arrives, we _________ (invite) them to sit with us.",
      options: [
        "will invite",
        "invites",
        "invited"
      ],
      correct: 0,
      explanation: "Great! In 1st Conditional: 'If + Present Simple, will + verb'."
    },
    {
      image: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=700&q=80",
      question: "Action against Bullying: What happens if you see someone suffering bullying?",
      options: [
        "If I see bullying, I will ignore the situation.",
        "If I see bullying, I will tell a trusted teacher or school councilor.",
        "If I see bullying, I will join the bullies."
      ],
      correct: 1,
      explanation: "Correct! Always ask for help if you witness bullying."
    },
    {
      image: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=700&q=80",
      question: "Complete: If we _________ (share) our lunch and materials, we will make good friends.",
      options: [
        "will share",
        "share",
        "sharing"
      ],
      correct: 1,
      explanation: "Nice! Use Simple Present in the 'If clause': 'If we share...'"
    },
    {
      image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=700&q=80",
      question: "Complete: If she asks to join our group project, we _________ (show) her respect.",
      options: [
        "showed",
        "will show",
        "shows"
      ],
      correct: 1,
      explanation: "Awesome! 'we WILL SHOW her respect' indicates future result."
    },
    {
      image: "https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=700&q=80",
      question: "Inclusion Challenge: If you _________ (invite) everyone to play, nobody _________ (feel) lonely.",
      options: [
        "invite / will feel",
        "will invite / feel",
        "invites / feels"
      ],
      correct: 0,
      explanation: "Perfect! If you INVITE everyone, nobody WILL FEEL lonely."
    }
  ];

  let currentIdx = 0;
  let score = 0;

  function loadQuestion() {
    const q = questions[currentIdx];
    document.getElementById("card-image").src = q.image;
    document.getElementById("question-text").innerText = q.question;
    
    const optsContainer = document.getElementById("options-container");
    optsContainer.innerHTML = "";
    
    document.getElementById("feedback").style.display = "none";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      optsContainer.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    const q = questions[currentIdx];
    const feedbackEl = document.getElementById("feedback");
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach(btn => btn.disabled = true);

    if (selectedIdx === q.correct) {
      score += 100;
      document.getElementById("score").innerText = score;
      feedbackEl.className = "feedback correct";
      feedbackEl.innerText = "✨ Correct! " + q.explanation;
    } else {
      feedbackEl.className = "feedback incorrect";
      feedbackEl.innerText = "❌ Keep trying! " + q.explanation;
    }

    feedbackEl.style.display = "block";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < questions.length) {
      loadQuestion();
    } else {
      showFinalScreen();
    }
  }

  function showFinalScreen() {
    document.getElementById("quiz-container").innerHTML = `
      <div style="text-align: center; padding: 20px;">
        <h2>🎉 Mission Accomplished!</h2>
        <p style="font-size: 1.2rem;">Your Team Earned: <strong>${score} Points</strong></p>
        <p>You learned how to use the <strong>1st Conditional</strong> to build an inclusive classroom free of <strong>bullying</strong>!</p>
        <button onclick="location.reload()" class="next-btn" style="display:inline-block; margin-top:15px;">Play Again 🔄</button>
      </div>
    `;
  }

  // Init App
  loadQuestion();
</script>
</body>
</html>
